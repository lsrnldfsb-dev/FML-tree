<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tree</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-left">
      <span class="logo">&#127795;</span>
      <h1>Family Tree</h1>
    </div>
    <div class="header-center" id="memberCount"></div>
    <div class="header-right">
      <button class="btn btn-ghost" id="refreshBtn" title="Refresh tree">&#8635;</button>
      <button class="btn btn-primary" id="addMemberBtn">+ Add Member</button>
    </div>
  </header>

  <!-- ── Main layout ── -->
  <div class="main-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-search">
        <input type="text" id="searchInput" placeholder="Search members&hellip;" autocomplete="off">
      </div>
      <div class="sidebar-list" id="memberList">
        <div class="sidebar-empty">Loading&hellip;</div>
      </div>
    </aside>

    <!-- Tree canvas -->
    <main class="tree-area">
      <div class="tree-toolbar">
        <button class="btn btn-sm btn-ghost" id="fitBtn" title="Fit to screen">&#8853; Fit</button>
        <button class="btn btn-sm btn-ghost" id="layoutBtn" title="Toggle layout">&#8645; Layout</button>
        <span class="toolbar-hint" id="toolbarHint">Click a node &bull; Double-click to edit</span>
      </div>
      <div id="treeContainer"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">&#128106;</div>
        <h2>Start Your Family Tree</h2>
        <p>Add your first family member to begin building your family history.</p>
        <button class="btn btn-primary" id="emptyAddBtn">+ Add First Member</button>
      </div>
    </main>

    <!-- Detail panel -->
    <aside class="detail-panel" id="detailPanel">
      <button class="panel-close" id="closePanelBtn">&#10005;</button>
      <div id="detailContent"></div>
    </aside>

  </div><!-- /.main-layout -->
</div><!-- /#app -->

<!-- ── Add / Edit Member Modal ── -->
<div class="overlay" id="memberOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Family Member</h2>
      <button class="modal-close" id="closeModalBtn">&#10005;</button>
    </div>
    <form id="memberForm" novalidate>
      <input type="hidden" id="memberId">

      <!-- Photo -->
      <div class="photo-row">
        <div class="photo-thumb" id="photoThumb"><span>&#128247;</span></div>
        <div class="photo-actions">
          <label class="btn btn-sm btn-outline" for="photoInput">Upload Photo</label>
          <input type="file" id="photoInput" accept="image/jpeg,image/png,image/gif,image/webp">
          <button type="button" class="btn btn-sm btn-ghost" id="removePhotoBtn">Remove</button>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-field span2">
          <label for="memberName">Full Name <span class="req">*</span></label>
          <input type="text" id="memberName" placeholder="e.g. Jane Smith" required>
        </div>
        <div class="form-field">
          <label for="memberGender">Gender</label>
          <select id="memberGender">
            <option value="unknown">Unknown</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-field">
          <label for="memberBirthDate">Birth Date</label>
          <input type="date" id="memberBirthDate">
        </div>
        <div class="form-field">
          <label for="memberDeathDate">Death Date</label>
          <input type="date" id="memberDeathDate">
        </div>
        <div class="form-field">
          <label for="memberBirthPlace">Birth Place</label>
          <input type="text" id="memberBirthPlace" placeholder="City, Country">
        </div>
        <div class="form-field span2">
          <label for="memberBio">Biography</label>
          <textarea id="memberBio" rows="4" placeholder="Share their story&hellip;"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveMemberBtn">Save Member</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Add Relationship Modal ── -->
<div class="overlay" id="relOverlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2>Add Relationship</h2>
      <button class="modal-close" id="closeRelBtn">&#10005;</button>
    </div>
    <div class="form-field">
      <label for="relType">Relationship Type</label>
      <select id="relType">
        <option value="parent-child">Parent &#8594; Child</option>
        <option value="spouse">Spouse &#8596; Spouse</option>
      </select>
    </div>
    <div class="form-field">
      <label id="rel1Label" for="rel1">Person 1</label>
      <select id="rel1"></select>
    </div>
    <div class="form-field">
      <label id="rel2Label" for="rel2">Person 2</label>
      <select id="rel2"></select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelRelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveRelBtn">Add Relationship</button>
    </div>
  </div>
</div>

<!-- ── Context Menu ── -->
<ul class="ctx-menu" id="ctxMenu">
  <li id="ctxEdit">&#9998; Edit</li>
  <li id="ctxRelation">&#10133; Add Relation</li>
  <li class="danger" id="ctxDelete">&#10006; Delete</li>
</ul>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
